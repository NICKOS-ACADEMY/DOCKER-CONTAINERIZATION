name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  push-docker-image-to-docker-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          # password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nickos-website:2.0.1 .

      - name: Tag latest
        run: |
          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/nickos-website:2.0.1
            # ${{ secrets.DOCKER_USERNAME }}/nickos-website:latest
            
      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nickos-website:2.0.1

          # docker push ${{ secrets.DOCKER_USERNAME }}/nickos-website:latest



